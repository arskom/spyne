variables:
  KUBERNETES_MEMORY_REQUEST_DEFAULT: "2000Mi"
  KUBERNETES_MEMORY_LIMIT_DEFAULT: "2000Mi"
  CODE_QUALITY: false

include:
  - component: $CI_SERVER_FQDN/gitlab-ci/ci-toolbox/python-library@1.0.93


unit-tests:
  script:
    # Install packages
    - pip install pipenv
    - pipenv install --dev
    - pipenv run pip install .

    # Run tests
    - pipenv run make test-isolated
